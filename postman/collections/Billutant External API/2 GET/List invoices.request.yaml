$kind: http-request
description: Verifies that the token, host, rewrite, feature flag, and rate limit path work.
url: "{{baseUrl}}/invoices"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: if (pm.environment.get("environment") === "allWorks") { pm.test('Status is 200', function () { pm.response.to.have.status(200); }); }
    language: text/javascript
order: 4000
