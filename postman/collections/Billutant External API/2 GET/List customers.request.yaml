$kind: http-request
url: "{{baseUrl}}/customers"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: if (pm.environment.get("environment") === "allWorks") { pm.test('Status is 200', function () { pm.response.to.have.status(200); }); }
    language: text/javascript
order: 1000
