$kind: collection
name: Billutant External API
variables:
  customer: ""
  item: ""
  email: ""
  invoice: ""
  draftinvoice: ""
  success: ""
scripts:
  - type: http:afterResponse
    code: "if (pm.environment.get(\"environment\") === \"allWorks\") {\r

      \    pm.test(\"Response time is fast enough\", function() {\r

      \        pm.expect(pm.response.responseTime).to.be.below(pm.environment.get(\"speed\"));\r

      \    });\r

      }"
auth:
  - id: 32ec1f49-4cc9-4ddd-9e16-8831816d9d63
    type: bearer
    name: bearer auth
    credentials:
      token: "{{authToken}}"
