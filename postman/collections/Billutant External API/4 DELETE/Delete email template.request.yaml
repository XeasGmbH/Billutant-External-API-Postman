$kind: http-request
description: Cleanup request. Run only after invoice send tests if you want to remove the test template.
url: "{{baseUrl}}/email-templates/{{email}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.environment.get("environment") === "allWorks") {
          pm.test('Status is 200', function () {
              pm.response.to.have.status(200);
          });
      }
      pm.collectionVariables.set("email", 0);
    language: text/javascript
order: 3000
