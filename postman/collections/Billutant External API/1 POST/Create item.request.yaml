$kind: http-request
url: "{{baseUrl}}/items"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "API Test Leistung",
      "description": "Manual API smoke test",
      "price": 120,
      "tax": 20,
      "unit": "Stk"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.environment.get("environment") === "allWorks") {
          pm.test('Status is 201', function () {
              pm.response.to.have.status(201);
          });
              
          let Data =pm.response.json();
          pm.collectionVariables.set("item", Data.data.id);
      }
    language: text/javascript
order: 2000
