$kind: http-request
description: Sends a real email to the customer address. Use a test customer email.
url: "{{baseUrl}}/invoices/{{invoice}}/send"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "emailTemplateId": "{{email}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.environment.get("environment") === "allWorks") {
          pm.test('Status is 201', function () {
              pm.response.to.have.status(201);
          });
          pm.test('Invoice was sent', function () {
              pm.expect(pm.response.json().data.sent).to.eql(true);
          });
      }
    language: text/javascript
order: 7000
