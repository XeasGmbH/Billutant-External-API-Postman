$kind: http-request
url: "{{baseUrl}}/customers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "company": "API Test Customer GmbH",
      "name": "Max Mustermann",
      "email": "api-test@example.com",
      "address": "Teststrasse 1",
      "zipCode": "1010",
      "city": "Wien",
      "country": "AT"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.environment.get("environment") === "allWorks") {
          pm.test('Status is 201', function () {
              pm.response.to.have.status(201);
          });
          
          let Data = pm.response.json();
          pm.collectionVariables.set("customer", Data.data.id);
      }
    language: text/javascript
order: 1000
