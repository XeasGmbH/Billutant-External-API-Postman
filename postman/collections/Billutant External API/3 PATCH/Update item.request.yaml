$kind: http-request
url: "{{baseUrl}}/items/{{item}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "price": 135,
      "description": "Updated manual API smoke test"
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: if (pm.environment.get("environment") === "allWorks") { pm.test('Status is 200', function () { pm.response.to.have.status(200); }); }
    language: text/javascript
order: 3000
