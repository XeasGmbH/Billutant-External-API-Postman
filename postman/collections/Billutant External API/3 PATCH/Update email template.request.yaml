$kind: http-request
url: "{{baseUrl}}/email-templates/{{email}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "subject": "Ihre aktualisierte Rechnung."
    }
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
scripts:
  - type: afterResponse
    code: if (pm.environment.get("environment") === "allWorks") { pm.test('Status is 200', function () { pm.response.to.have.status(200); }); }
    language: text/javascript
order: 4000
